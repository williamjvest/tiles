name: Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  camerakit:
    name: CameraKit package tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && swift --version
      - name: Build and test (simulated cameras, no hardware)
        working-directory: Packages/CameraKit
        run: swift test --disable-keychain
