# XcodeGen spec. Generate the project with `cd App && xcodegen`, then open CameraControl.xcodeproj.
# The .xcodeproj is generated and gitignored; edit this file instead.
name: CameraControl
options:
  bundleIdPrefix: com.toldwell
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    # Switch teams by changing TOLDWELL_TEAM_ID, and the app's identifier with TILES_BUNDLE_ID (a team can't sign with
    # another team's). Everything else reads from these.
    TOLDWELL_TEAM_ID: D255V5QY5L   # the App Store team; put your own here to build for a device
    TILES_BUNDLE_ID: com.toldwell.tiles
  configs:
    Release:
      # Optimize for binary size rather than speed. Negligible perf impact for a
      # UI-bound camera-control app; saves ~5-8% on Swift code.
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
      # Strip dead code and private symbols from the final binary.
      DEAD_CODE_STRIPPING: YES
      STRIP_INSTALLED_PRODUCT: YES
      # "non-global" avoids "symbols referenced by indirect symbol table entries that can't be stripped".
      STRIP_STYLE: non-global
      # Whole-module LTO: lets the linker strip cross-module dead code and inline
      # across Swift modules. Increases build time but reduces binary size.
      LLVM_LTO: YES_THIN
      # Compress asset catalog for distribution.
      ASSETCATALOG_COMPILER_OPTIMIZATION: space
packages:
  CameraKit:
    path: ../Packages/CameraKit
targets:
  CameraControl:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: CameraControl
    dependencies:
      - package: CameraKit
        product: CameraCore
      - package: CameraKit
        product: DashboardUI
      - package: CameraKit
        product: SonyPTP
      - package: CameraKit
        product: SSHTunnel
      - package: CameraKit
        product: BlackmagicRESTBackend
      - package: CameraKit
        product: BlackmagicBLE
      - package: CameraKit
        product: SonySavona
      - package: CameraKit
        product: ArriWebRemote
    info:
      path: CameraControl/Info.plist
      properties:
        CFBundleDisplayName: Tiles
        CFBundleName: Tiles
        # Without explicit bindings the generated Info.plist ignores MARKETING_VERSION and CURRENT_PROJECT_VERSION.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Required for a Mac App Store / TestFlight upload ("Photo & Video").
        LSApplicationCategoryType: public.app-category.photography
        # NO: industry-standard encryption only (SSH/libssh2/OpenSSL, TLS/URLSession), which needs export documentation
        # only for France. Keep France out of the App Store availability, or upload the French declaration and switch
        # to YES with the code Apple issues; YES without it fails the upload.
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Tiles connects to your cameras on the local network to show and change their settings, and finds the HaLow radio nodes there.
        # A camera on the USB-C port is controlled through ImageCaptureCore, which asks with this text.
        NSCameraUsageDescription: Tiles controls a camera connected with a USB-C cable.
        # Blackmagic cameras over Bluetooth LE (Add Camera, Over Bluetooth): asked when the list is first opened.
        NSBluetoothAlwaysUsageDescription: Tiles controls Blackmagic cameras near you over Bluetooth, and finds them to add.
        # _twcc._tcp: the Control API server advertises over Bonjour so Stream Deck and Companion can find it.
        # _http._tcp: HaLow nodes (OpenWrt, avahi) advertise their web interface; the app browses for it to find them.
        NSBonjourServices:
          - _twcc._tcp
          - _http._tcp
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        # Earlier builds were com.toldwell.twcc, on another team. iOS treats a new identifier as a new app, so their
        # cameras, pages and passwords don't carry over to this one.
        PRODUCT_BUNDLE_IDENTIFIER: $(TILES_BUNDLE_ID)
        # The app's file name, Tiles.app, is what a Mac shows in Applications, Finder, Spotlight and the Dock; CFBundleName
        # and CFBundleDisplayName don't change that. Builds up to 28 installed as CameraControl.app. The target and scheme
        # keep the name CameraControl.
        PRODUCT_NAME: Tiles
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(TOLDWELL_TEAM_ID)
        ENABLE_HARDENED_RUNTIME: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": CameraControl/CameraControl-macOS.entitlements
